<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2048</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      overflow: hidden;
    }
    .header {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .title {
      font-size: 38px;
      font-weight: 800;
      color: #f59e0b;
      letter-spacing: -1px;
    }
    .scores {
      display: flex;
      gap: 8px;
    }
    .score-box {
      background: #1e293b;
      padding: 6px 12px;
      border-radius: 8px;
      text-align: center;
      min-width: 70px;
      border: 1px solid #334155;
    }
    .score-label {
      font-size: 10px;
      text-transform: uppercase;
      color: #94a3b8;
      font-weight: 600;
    }
    .score-val {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }
    .controls-bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .btn {
      background: #f59e0b;
      color: #0f172a;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #d97706; }
    .hint { font-size: 12px; color: #64748b; }
    .board-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      background: #1e293b;
      border-radius: 12px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      border: 2px solid #334155;
    }
    .cell {
      background: #0f172a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      transition: transform 0.1s ease-in-out;
    }
    .tile-2 { background: #e2e8f0; color: #1e293b; }
    .tile-4 { background: #cbd5e1; color: #0f172a; }
    .tile-8 { background: #fdba74; color: #fff; }
    .tile-16 { background: #fb923c; color: #fff; }
    .tile-32 { background: #f97316; color: #fff; }
    .tile-64 { background: #ea580c; color: #fff; }
    .tile-128 { background: #facc15; color: #0f172a; box-shadow: 0 0 10px #facc15; }
    .tile-256 { background: #eab308; color: #0f172a; box-shadow: 0 0 12px #eab308; }
    .tile-512 { background: #ca8a04; color: #fff; box-shadow: 0 0 14px #ca8a04; }
    .tile-1024 { background: #a855f7; color: #fff; font-size: 20px; box-shadow: 0 0 16px #a855f7; }
    .tile-2048 { background: #ec4899; color: #fff; font-size: 20px; box-shadow: 0 0 20px #ec4899; }
    .tile-super { background: #06b6d4; color: #fff; font-size: 18px; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .overlay.active {
      opacity: 1;
      pointer-events: all;
    }
    .overlay-msg {
      font-size: 28px;
      font-weight: 800;
      color: #f8fafc;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">Score</div>
        <div id="score" class="score-val">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">Best</div>
        <div id="best-score" class="score-val">0</div>
      </div>
    </div>
  </div>

  <div class="controls-bar">
    <button id="restart-btn" class="btn">New Game</button>
    <div class="hint">Use Arrow keys or swipe</div>
  </div>

  <div id="board" class="board-container">
    <!-- 16 cells -->
    <div class="cell" id="c0"></div><div class="cell" id="c1"></div><div class="cell" id="c2"></div><div class="cell" id="c3"></div>
    <div class="cell" id="c4"></div><div class="cell" id="c5"></div><div class="cell" id="c6"></div><div class="cell" id="c7"></div>
    <div class="cell" id="c8"></div><div class="cell" id="c9"></div><div class="cell" id="c10"></div><div class="cell" id="c11"></div>
    <div class="cell" id="c12"></div><div class="cell" id="c13"></div><div class="cell" id="c14"></div><div class="cell" id="c15"></div>

    <div id="game-overlay" class="overlay">
      <div id="overlay-text" class="overlay-msg">Game Over!</div>
      <button id="retry-btn" class="btn">Try Again</button>
    </div>
  </div>

  <script>
    let board = Array(16).fill(0);
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('vault_2048_best') || '0', 10);
    document.getElementById('best-score').textContent = bestScore;

    function init() {
      board = Array(16).fill(0);
      score = 0;
      updateScore();
      addRandomTile();
      addRandomTile();
      render();
      document.getElementById('game-overlay').classList.remove('active');
    }

    function addRandomTile() {
      const emptyCells = [];
      for (let i = 0; i < 16; i++) {
        if (board[i] === 0) emptyCells.push(i);
      }
      if (emptyCells.length === 0) return;
      const spot = emptyCells[Math.floor(Math.random() * emptyCells.length)];
      board[spot] = Math.random() < 0.9 ? 2 : 4;
    }

    function render() {
      for (let i = 0; i < 16; i++) {
        const cell = document.getElementById('c' + i);
        const val = board[i];
        cell.className = 'cell';
        if (val > 0) {
          cell.textContent = val;
          if (val <= 2048) {
            cell.classList.add('tile-' + val);
          } else {
            cell.classList.add('tile-super');
          }
        } else {
          cell.textContent = '';
        }
      }
    }

    function updateScore() {
      document.getElementById('score').textContent = score;
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('vault_2048_best', bestScore);
        document.getElementById('best-score').textContent = bestScore;
      }
    }

    function slide(row) {
      let filtered = row.filter(val => val !== 0);
      for (let i = 0; i < filtered.length - 1; i++) {
        if (filtered[i] === filtered[i + 1]) {
          filtered[i] *= 2;
          score += filtered[i];
          filtered[i + 1] = 0;
        }
      }
      filtered = filtered.filter(val => val !== 0);
      while (filtered.length < 4) {
        filtered.push(0);
      }
      return filtered;
    }

    function moveLeft() {
      let moved = false;
      for (let r = 0; r < 4; r++) {
        const row = [board[r*4], board[r*4+1], board[r*4+2], board[r*4+3]];
        const next = slide(row);
        for (let c = 0; c < 4; c++) {
          if (board[r*4+c] !== next[c]) moved = true;
          board[r*4+c] = next[c];
        }
      }
      return moved;
    }

    function moveRight() {
      let moved = false;
      for (let r = 0; r < 4; r++) {
        const row = [board[r*4+3], board[r*4+2], board[r*4+1], board[r*4]];
        const next = slide(row);
        for (let c = 0; c < 4; c++) {
          if (board[r*4+(3-c)] !== next[c]) moved = true;
          board[r*4+(3-c)] = next[c];
        }
      }
      return moved;
    }

    function moveUp() {
      let moved = false;
      for (let c = 0; c < 4; c++) {
        const col = [board[c], board[4+c], board[8+c], board[12+c]];
        const next = slide(col);
        for (let r = 0; r < 4; r++) {
          if (board[r*4+c] !== next[r]) moved = true;
          board[r*4+c] = next[r];
        }
      }
      return moved;
    }

    function moveDown() {
      let moved = false;
      for (let c = 0; c < 4; c++) {
        const col = [board[12+c], board[8+c], board[4+c], board[c]];
        const next = slide(col);
        for (let r = 0; r < 4; r++) {
          if (board[(3-r)*4+c] !== next[r]) moved = true;
          board[(3-r)*4+c] = next[r];
        }
      }
      return moved;
    }

    function canMove() {
      if (board.includes(0)) return true;
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const val = board[r*4+c];
          if (c < 3 && val === board[r*4+c+1]) return true;
          if (r < 3 && val === board[(r+1)*4+c]) return true;
        }
      }
      return false;
    }

    function handleMove(direction) {
      let moved = false;
      if (direction === 'left') moved = moveLeft();
      if (direction === 'right') moved = moveRight();
      if (direction === 'up') moved = moveUp();
      if (direction === 'down') moved = moveDown();

      if (moved) {
        addRandomTile();
        updateScore();
        render();
        if (!canMove()) {
          document.getElementById('overlay-text').textContent = 'Game Over!';
          document.getElementById('game-overlay').classList.add('active');
        }
      }
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); handleMove('up'); }
      else if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); handleMove('down'); }
      else if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); handleMove('left'); }
      else if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); handleMove('right'); }
    });

    // Touch Swipe Support
    let touchStartX = 0, touchStartY = 0;
    const boardEl = document.getElementById('board');
    boardEl.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    boardEl.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
        handleMove(dx > 0 ? 'right' : 'left');
      } else if (Math.abs(dy) > 30) {
        handleMove(dy > 0 ? 'down' : 'up');
      }
    }, { passive: true });

    document.getElementById('restart-btn').addEventListener('click', init);
    document.getElementById('retry-btn').addEventListener('click', init);

    init();
  </script>
</body>
</html>
