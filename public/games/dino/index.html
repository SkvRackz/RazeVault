<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dino T-Rex Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #94a3b8;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      overflow: hidden;
    }
    .hud {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: flex-end;
      gap: 16px;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .hud span { color: #f8fafc; }
    .game-box {
      position: relative;
      border: 2px solid #334155;
      border-radius: 8px;
      background: #020617;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    canvas {
      display: block;
      background: #020617;
      border-radius: 6px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-radius: 6px;
      font-family: system-ui, sans-serif;
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #10b981;
      color: #020617;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    .btn:hover { background: #059669; }
    .controls-hint {
      margin-top: 12px;
      font-size: 12px;
      color: #64748b;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>HI <span id="hi-score">00000</span></div>
    <div><span id="score">00000</span></div>
  </div>

  <div class="game-box">
    <canvas id="dino" width="600" height="200"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="msg" style="color:#f8fafc; font-size:24px;">DINO T-REX RUNNER</h2>
      <button id="start-btn" class="btn">PRESS SPACE TO JUMP</button>
    </div>
  </div>

  <div class="controls-hint">Space / Arrow Up: Jump &bull; Arrow Down: Duck</div>

  <script>
    const canvas = document.getElementById('dino');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const hiScoreEl = document.getElementById('hi-score');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');

    let hiScore = parseInt(localStorage.getItem('vault_dino_hi') || '0', 10);
    hiScoreEl.textContent = String(hiScore).padStart(5, '0');

    let isRunning = false;
    let score = 0;
    let speed = 6;
    let animId = null;

    const GROUND_Y = 160;

    const dino = {
      x: 50,
      y: GROUND_Y - 40,
      w: 36,
      h: 40,
      vy: 0,
      gravity: 0.85,
      jumpStrength: -13,
      isGrounded: true,
      isDucking: false
    };

    let obstacles = [];
    let clouds = [];
    let nextObstacleTimer = 0;

    function resetGame() {
      score = 0;
      speed = 6.5;
      dino.y = GROUND_Y - 40;
      dino.vy = 0;
      dino.isGrounded = true;
      dino.isDucking = false;
      obstacles = [];
      clouds = [
        { x: 150, y: 40, w: 50 },
        { x: 380, y: 60, w: 40 },
        { x: 520, y: 30, w: 45 }
      ];
      nextObstacleTimer = 60;
      isRunning = true;
      overlay.classList.add('hidden');
      if (animId) cancelAnimationFrame(animId);
      animId = requestAnimationFrame(loop);
    }

    function jump() {
      if (dino.isGrounded) {
        dino.vy = dino.jumpStrength;
        dino.isGrounded = false;
      }
    }

    function spawnObstacle() {
      const type = Math.random() < 0.25 && score > 200 ? 'bird' : 'cactus';
      if (type === 'cactus') {
        const count = Math.random() < 0.4 ? 2 : 1;
        obstacles.push({
          type: 'cactus',
          x: canvas.width + 10,
          y: GROUND_Y - 36,
          w: count === 2 ? 34 : 20,
          h: 36
        });
      } else {
        const heightLevel = Math.random() < 0.5 ? GROUND_Y - 55 : GROUND_Y - 30;
        obstacles.push({
          type: 'bird',
          x: canvas.width + 10,
          y: heightLevel,
          w: 32,
          h: 22,
          wingState: 0
        });
      }
    }

    function checkCollision(d, o) {
      const dH = d.isDucking ? 22 : d.h;
      const dY = d.isDucking ? GROUND_Y - 22 : d.y;
      return (
        d.x + 4 < o.x + o.w &&
        d.x + d.w - 4 > o.x &&
        dY + 4 < o.y + o.h &&
        dY + dH > o.y + 4
      );
    }

    function loop() {
      if (!isRunning) return;

      // Update Dino physics
      dino.vy += dino.gravity;
      dino.y += dino.vy;
      const currentH = dino.isDucking ? 22 : 40;
      if (dino.y >= GROUND_Y - currentH) {
        dino.y = GROUND_Y - currentH;
        dino.vy = 0;
        dino.isGrounded = true;
      }

      // Update Obstacles
      nextObstacleTimer--;
      if (nextObstacleTimer <= 0) {
        spawnObstacle();
        nextObstacleTimer = Math.floor(Math.random() * 50) + Math.max(45, 90 - Math.floor(score / 50));
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= speed;
        if (obstacles[i].type === 'bird') {
          obstacles[i].wingState = (obstacles[i].wingState + 0.15) % 2;
        }

        // Collision check
        if (checkCollision(dino, obstacles[i])) {
          gameOver();
          return;
        }

        if (obstacles[i].x + obstacles[i].w < -20) {
          obstacles.splice(i, 1);
        }
      }

      // Clouds
      clouds.forEach(c => {
        c.x -= speed * 0.2;
        if (c.x + c.w < -10) c.x = canvas.width + Math.random() * 80;
      });

      // Score
      score += 0.15;
      speed = 6.5 + Math.min(6, score / 400);
      const displayScore = Math.floor(score);
      scoreEl.textContent = String(displayScore).padStart(5, '0');

      if (displayScore > hiScore) {
        hiScore = displayScore;
        hiScoreEl.textContent = String(hiScore).padStart(5, '0');
        localStorage.setItem('vault_dino_hi', hiScore);
      }

      draw();
      animId = requestAnimationFrame(loop);
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = '#1e293b';
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.roundRect(c.x, c.y, c.w, 14, 7);
        ctx.fill();
      });

      // Ground Line
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(canvas.width, GROUND_Y);
      ctx.stroke();

      // Ground texture dashes
      ctx.fillStyle = '#1e293b';
      for (let i = 0; i < canvas.width; i += 40) {
        ctx.fillRect((i - (score * speed * 2) % 40), GROUND_Y + 8, 12, 2);
      }

      // Draw Dino
      ctx.fillStyle = '#10b981';
      const dH = dino.isDucking ? 22 : dino.h;
      const dY = dino.isDucking ? GROUND_Y - 22 : dino.y;

      // Body & Head
      ctx.fillRect(dino.x + 6, dY, dino.w - 6, dH);
      // Snout
      if (!dino.isDucking) {
        ctx.fillRect(dino.x + 18, dY, 18, 14);
        // Eye
        ctx.fillStyle = '#020617';
        ctx.fillRect(dino.x + 22, dY + 3, 3, 3);
        ctx.fillStyle = '#10b981';
      }

      // Draw Obstacles
      obstacles.forEach(o => {
        if (o.type === 'cactus') {
          ctx.fillStyle = '#f43f5e';
          ctx.fillRect(o.x, o.y, o.w, o.h);
          ctx.fillRect(o.x - 3, o.y + 8, 4, 12);
          ctx.fillRect(o.x + o.w - 1, o.y + 12, 4, 10);
        } else {
          ctx.fillStyle = '#eab308';
          ctx.fillRect(o.x, o.y + 6, o.w, o.h - 12);
          // Wings
          const wingOffset = o.wingState > 1 ? -8 : 6;
          ctx.fillRect(o.x + 10, o.y + 6 + wingOffset, 12, 6);
        }
      });
    }

    function gameOver() {
      isRunning = false;
      document.getElementById('msg').textContent = 'GAME OVER';
      startBtn.textContent = 'PLAY AGAIN';
      overlay.classList.remove('hidden');
    }

    window.addEventListener('keydown', (e) => {
      if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
        e.preventDefault();
        if (!isRunning) resetGame();
        else jump();
      }
      if (['ArrowDown', 'KeyS'].includes(e.code)) {
        dino.isDucking = true;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowDown', 'KeyS'].includes(e.code)) {
        dino.isDucking = false;
      }
    });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (!isRunning) resetGame();
      else jump();
    }, { passive: false });

    startBtn.addEventListener('click', resetGame);
    draw();
  </script>
</body>
</html>
