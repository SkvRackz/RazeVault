<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Breakout Retro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      overflow: hidden;
    }
    .hud {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 700;
    }
    .hud span { color: #38bdf8; }
    .game-box {
      position: relative;
      border: 2px solid #334155;
      border-radius: 8px;
      background: #020617;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    canvas { display: block; border-radius: 6px; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      border-radius: 6px;
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    .btn:hover { background: #2563eb; }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>LIVES: <span id="lives">❤❤❤</span></div>
  </div>

  <div class="game-box">
    <canvas id="breakout" width="480" height="400"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="msg" style="color:#38bdf8; font-size:24px;">BREAKOUT RETRO</h2>
      <button id="start-btn" class="btn">START GAME</button>
    </div>
  </div>

  <div style="margin-top:12px; font-size:12px; color:#64748b;">Move mouse or Arrow keys &bull; Clear all bricks!</div>

  <script>
    const canvas = document.getElementById('breakout');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const msgEl = document.getElementById('msg');

    let score = 0;
    let lives = 3;
    let isRunning = false;
    let animId = null;

    const paddle = {
      w: 80,
      h: 12,
      x: (canvas.width - 80) / 2,
      speed: 7
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height - 30,
      r: 6,
      dx: 4,
      dy: -4
    };

    const BRICK_ROWS = 5;
    const BRICK_COLS = 8;
    const BRICK_W = 52;
    const BRICK_H = 16;
    const BRICK_PAD = 6;
    const BRICK_TOP = 40;
    const BRICK_LEFT = 11;

    const ROW_COLORS = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6'];

    let bricks = [];

    function initBricks() {
      bricks = [];
      for (let c = 0; c < BRICK_COLS; c++) {
        bricks[c] = [];
        for (let r = 0; r < BRICK_ROWS; r++) {
          bricks[c][r] = { x: 0, y: 0, status: 1, color: ROW_COLORS[r] };
        }
      }
    }

    function resetGame() {
      score = 0;
      lives = 3;
      scoreEl.textContent = '0';
      livesEl.textContent = '❤❤❤';
      initBricks();
      resetBall();
      isRunning = true;
      overlay.classList.add('hidden');
      if (animId) cancelAnimationFrame(animId);
      animId = requestAnimationFrame(loop);
    }

    function resetBall() {
      ball.x = canvas.width / 2;
      ball.y = canvas.height - 40;
      ball.dx = (Math.random() > 0.5 ? 4 : -4);
      ball.dy = -4.5;
      paddle.x = (canvas.width - paddle.w) / 2;
    }

    let rightPressed = false;
    let leftPressed = false;

    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowRight' || e.code === 'KeyD') rightPressed = true;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') leftPressed = true;
    });

    window.addEventListener('keyup', e => {
      if (e.code === 'ArrowRight' || e.code === 'KeyD') rightPressed = false;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') leftPressed = false;
    });

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const relativeX = e.clientX - rect.left;
      if (relativeX > 0 && relativeX < canvas.width) {
        paddle.x = relativeX - paddle.w / 2;
      }
    });

    function collisionDetection() {
      let activeBricks = 0;
      for (let c = 0; c < BRICK_COLS; c++) {
        for (let r = 0; r < BRICK_ROWS; r++) {
          const b = bricks[c][r];
          if (b.status === 1) {
            activeBricks++;
            if (
              ball.x > b.x &&
              ball.x < b.x + BRICK_W &&
              ball.y > b.y &&
              ball.y < b.y + BRICK_H
            ) {
              ball.dy = -ball.dy;
              b.status = 0;
              score += (5 - r) * 10;
              scoreEl.textContent = score;
            }
          }
        }
      }

      if (activeBricks === 0) {
        victory();
      }
    }

    function loop() {
      if (!isRunning) return;

      if (rightPressed && paddle.x < canvas.width - paddle.w) paddle.x += paddle.speed;
      if (leftPressed && paddle.x > 0) paddle.x -= paddle.speed;

      // Ball wall collisions
      if (ball.x + ball.dx > canvas.width - ball.r || ball.x + ball.dx < ball.r) {
        ball.dx = -ball.dx;
      }
      if (ball.y + ball.dy < ball.r) {
        ball.dy = -ball.dy;
      } else if (ball.y + ball.dy > canvas.height - ball.r - paddle.h - 10) {
        // Paddle collision
        if (ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
          const hitPos = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
          ball.dx = hitPos * 5.5;
          ball.dy = -Math.abs(ball.dy);
        } else if (ball.y + ball.dy > canvas.height - ball.r) {
          lives--;
          livesEl.textContent = '❤'.repeat(lives);
          if (lives <= 0) {
            gameOver();
            return;
          } else {
            resetBall();
          }
        }
      }

      ball.x += ball.dx;
      ball.y += ball.dy;

      collisionDetection();
      draw();
      animId = requestAnimationFrame(loop);
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw bricks
      for (let c = 0; c < BRICK_COLS; c++) {
        for (let r = 0; r < BRICK_ROWS; r++) {
          if (bricks[c][r].status === 1) {
            const brickX = c * (BRICK_W + BRICK_PAD) + BRICK_LEFT;
            const brickY = r * (BRICK_H + BRICK_PAD) + BRICK_TOP;
            bricks[c][r].x = brickX;
            bricks[c][r].y = brickY;
            ctx.fillStyle = bricks[c][r].color;
            ctx.beginPath();
            ctx.roundRect(brickX, brickY, BRICK_W, BRICK_H, 3);
            ctx.fill();
          }
        }
      }

      // Draw Ball
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();

      // Draw Paddle
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.roundRect(paddle.x, canvas.height - paddle.h - 10, paddle.w, paddle.h, 6);
      ctx.fill();
    }

    function victory() {
      isRunning = false;
      msgEl.textContent = 'YOU WIN! 🎉';
      startBtn.textContent = 'PLAY AGAIN';
      overlay.classList.remove('hidden');
    }

    function gameOver() {
      isRunning = false;
      msgEl.textContent = 'GAME OVER';
      startBtn.textContent = 'TRY AGAIN';
      overlay.classList.remove('hidden');
    }

    startBtn.addEventListener('click', resetGame);
    initBricks();
    draw();
  </script>
</body>
</html>
