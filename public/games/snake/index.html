<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Retro Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #38bdf8;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      overflow: hidden;
    }
    .hud {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: bold;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .hud span { color: #f8fafc; font-size: 20px; }
    .game-box {
      position: relative;
      border: 3px solid #1e293b;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.15);
      border-radius: 8px;
      background: #020617;
    }
    canvas {
      display: block;
      background: #020617;
      border-radius: 5px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: system-ui, sans-serif;
    }
    .overlay.hidden { display: none; }
    .overlay h2 {
      color: #f43f5e;
      font-size: 28px;
      letter-spacing: 1px;
    }
    .btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn:hover { background: #0369a1; }
    .controls-hint {
      margin-top: 12px;
      font-size: 13px;
      color: #64748b;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>BEST: <span id="best">0</span></div>
  </div>

  <div class="game-box">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="msg">RETRO SNAKE</h2>
      <button id="start-btn" class="btn">START GAME</button>
    </div>
  </div>

  <div class="controls-hint">Controls: Arrow Keys or W/A/S/D &bull; Space to Pause</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const msgEl = document.getElementById('msg');

    const GRID = 20;
    const COUNT = canvas.width / GRID;
    let snake = [];
    let food = { x: 5, y: 5 };
    let dx = 1, dy = 0;
    let nextDx = 1, nextDy = 0;
    let score = 0;
    let best = parseInt(localStorage.getItem('vault_snake_best') || '0', 10);
    bestEl.textContent = best;
    let gameLoop = null;
    let isRunning = false;
    let isPaused = false;

    // Web Audio synthesizer for nostalgic retro beeps
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq = 440, duration = 0.08, type = 'square') {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      scoreEl.textContent = '0';
      spawnFood();
      isRunning = true;
      isPaused = false;
      overlay.classList.add('hidden');
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 90);
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food = {
          x: Math.floor(Math.random() * COUNT),
          y: Math.floor(Math.random() * COUNT)
        };
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function update() {
      if (isPaused) return;

      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= COUNT || head.y < 0 || head.y >= COUNT) {
        return gameOver();
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      // Check food eat
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem('vault_snake_best', best);
        }
        beep(587.33, 0.09); // D5 chime
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Background grid
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i <= canvas.width; i += GRID) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Draw Food
      ctx.fillStyle = '#f43f5e';
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Draw Snake
      ctx.shadowBlur = 0;
      snake.forEach((part, index) => {
        if (index === 0) {
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(part.x * GRID + 1, part.y * GRID + 1, GRID - 2, GRID - 2);
        } else {
          ctx.fillStyle = '#0284c7';
          ctx.fillRect(part.x * GRID + 2, part.y * GRID + 2, GRID - 4, GRID - 4);
        }
      });
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameLoop);
      beep(150, 0.25, 'sawtooth');
      msgEl.textContent = 'GAME OVER';
      startBtn.textContent = 'PLAY AGAIN';
      overlay.classList.remove('hidden');
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        if (isRunning) isPaused = !isPaused;
        return;
      }
      if (!isRunning) return;

      if ((e.code === 'ArrowUp' || e.code === 'KeyW') && dy === 0) {
        nextDx = 0; nextDy = -1;
      } else if ((e.code === 'ArrowDown' || e.code === 'KeyS') && dy === 0) {
        nextDx = 0; nextDy = 1;
      } else if ((e.code === 'ArrowLeft' || e.code === 'KeyA') && dx === 0) {
        nextDx = -1; nextDy = 0;
      } else if ((e.code === 'ArrowRight' || e.code === 'KeyD') && dx === 0) {
        nextDx = 1; nextDy = 0;
      }
    });

    startBtn.addEventListener('click', resetGame);
    draw();
  </script>
</body>
</html>
